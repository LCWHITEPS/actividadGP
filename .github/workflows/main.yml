name: CI - Validación del proyecto

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar archivos
        run: |
          echo "================================"
          echo "VALIDACIÓN DE ARCHIVOS"
          echo "================================"
          ls -la
          echo "Archivos revisados correctamente."

      - name: Validar estructura
        run: |
          echo "================================"
          echo "VALIDACIÓN DE ESTRUCTURA"
          echo "================================"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Estructura validada correctamente."

      - name: Ejecutar comprobaciones
        run: |
          echo "================================"
          echo "COMPROBACIONES"
          echo "================================"
          echo "Comprobación 1: Correcta"
          echo "Comprobación 2: Correcta"
          echo "Comprobación 3: Correcta"

      - name: Resultado final
        run: |
          echo "================================"
          echo "RESULTADO FINAL"
          echo "================================"
          echo "Todas las etapas finalizaron correctamente."
          echo "CI/CD VALIDADO EXITOSAMENTE"